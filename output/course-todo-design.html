<style>
#ku-todo-design{--kt-bg:light-dark(#f7f9fd,#151c29);--kt-panel:light-dark(#fff,#202a3c);--kt-text:light-dark(#18253f,#e8eef9);--kt-muted:light-dark(#66748e,#b3bfd5);--kt-line:light-dark(#e1e8f5,#3a4861);--kt-blue:light-dark(#315ee8,#96b3ff);--kt-soft:light-dark(#eef3ff,#283951);--kt-red:light-dark(#ba2941,#ff9dac);font:14px/1.5 system-ui,sans-serif;color:var(--kt-text)}
#ku-todo-design *{box-sizing:border-box}#ku-todo-design button,#ku-todo-design input,#ku-todo-design select{font:inherit}#ku-todo-design button{cursor:pointer;border:1px solid var(--kt-line);border-radius:8px;background:var(--kt-panel);color:var(--kt-blue);padding:6px 10px;min-height:32px}#ku-todo-design button:focus-visible,#ku-todo-design input:focus-visible{outline:2px solid var(--kt-blue);outline-offset:2px}#ku-todo-design button[aria-pressed=true]{background:var(--kt-blue);color:var(--kt-panel)}#ku-todo-design h2,#ku-todo-design h3,#ku-todo-design p{margin:0}#ku-todo-design h2{font-size:18px}#ku-todo-design h3{font-size:15px}#ku-todo-design small{font-size:12px;color:var(--kt-muted)}
#ku-todo-design .kt-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}#ku-todo-design .kt-shell{background:var(--kt-bg);border:1px solid var(--kt-line);border-radius:14px;overflow:hidden}#ku-todo-design .kt-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--kt-line);background:var(--kt-panel)}#ku-todo-design .kt-content{padding:20px;display:grid;gap:20px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}#ku-todo-design .kt-panel{background:var(--kt-panel);border:1px solid var(--kt-line);border-radius:12px;padding:16px;min-width:0}#ku-todo-design .kt-courses{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}#ku-todo-design .kt-course{width:188px;min-height:156px;background:var(--kt-soft);border:1px solid var(--kt-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}#ku-todo-design .kt-course-title{color:var(--kt-blue);min-height:40px;overflow-wrap:anywhere}#ku-todo-design .kt-actions{display:flex;gap:6px;margin-top:4px}#ku-todo-design .kt-alert{margin-top:auto;padding-top:6px;color:var(--kt-red);font-size:12px;font-weight:600}#ku-todo-design .kt-list{margin-top:12px}#ku-todo-design .kt-row{padding:12px 0;border-top:1px solid var(--kt-line);display:flex;align-items:flex-start;gap:9px}#ku-todo-design .kt-row input{accent-color:var(--kt-blue);margin-top:5px;width:16px;height:16px;flex-shrink:0}#ku-todo-design .kt-row label{flex:1;min-width:0;overflow-wrap:anywhere}#ku-todo-design .kt-row small{display:block}#ku-todo-design .kt-done{text-decoration:line-through;color:var(--kt-muted)}#ku-todo-design .kt-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#ku-todo-design .kt-add input{flex:1;min-width:100px;background:var(--kt-panel);color:var(--kt-text);padding:9px;border:1px solid var(--kt-line);border-radius:8px}#ku-todo-design .kt-popup{max-width:400px;margin:0 auto}#ku-todo-design .kt-popup-content{padding:16px}#ku-todo-design .kt-select{width:100%;padding:9px;border:1px solid var(--kt-line);border-radius:8px;background:var(--kt-panel);color:var(--kt-text)}#ku-todo-design .kt-editor{margin-top:16px}#ku-todo-design .kt-footer{margin-top:16px;border-top:1px solid var(--kt-line);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}#ku-todo-design [hidden]{display:none!important}#ku-todo-design .kt-status{margin-top:10px;min-height:20px;color:var(--kt-muted);font-size:12px}@media(max-width:650px){#ku-todo-design .kt-content{grid-template-columns:1fr;padding:12px}#ku-todo-design .kt-header{padding:12px}#ku-todo-design .kt-course{flex:1;min-width:170px}}@media(pointer:coarse){#ku-todo-design button{min-height:44px}#ku-todo-design .kt-add input{font-size:16px}}
</style>
<div id="ku-todo-design">
  <nav class="kt-nav" aria-label="设计预览入口"><button data-view="home" aria-pressed="true">LMS 主页与课程卡片</button><button data-view="popup" aria-pressed="false">扩展弹窗</button><small>交互草案 · 示例数据</small></nav>
  <section class="kt-shell" data-screen="home">
    <header class="kt-header"><h2>関大LMS</h2><span>ホーム <small>2026 秋学期</small></span></header>
    <div class="kt-content">
      <section class="kt-panel"><h3>時間割</h3><small>水曜日 · 9/30</small><div class="kt-courses">
        <article class="kt-course"><div class="kt-course-title">サウンド知覚情報処理</div><small>3限 · 70478</small><div class="kt-actions"><button aria-label="シラバス（プレビュー）" data-syllabus>シ</button><button data-course="sound" aria-label="サウンド知覚情報処理のTODO"><span aria-hidden="true">☑</span> <span data-count="sound">2</span></button></div><div class="kt-alert">● 締切間近</div></article>
        <article class="kt-course"><div class="kt-course-title">プログラミング実習（Ｐｙｔｈｏｎ）</div><small>2限 · 70623</small><div class="kt-actions"><button aria-label="シラバス（プレビュー）" data-syllabus>シ</button><button data-course="python" aria-label="PythonのTODO"><span aria-hidden="true">☑</span> <span data-count="python">1</span></button></div></article>
      </div><div class="kt-editor" id="kt-course-editor" hidden><div class="kt-header"><h3 id="kt-editor-title"></h3><button id="kt-close" aria-label="课程待办を閉じる">关闭</button></div><div id="kt-course-list"></div><form class="kt-add" id="kt-course-form"><input aria-label="新建课程 TODO" placeholder="新しいTODOを追加…" maxlength="200" required><button type="submit">追加</button></form></div></section>
      <aside class="kt-panel"><div class="kt-header"><h3>マイTODO <span data-total>3</span></h3><small>未完了</small></div><div class="kt-list" id="kt-home-list"></div><small>课程名称可点击，进入对应 TODO</small></aside>
    </div>
  </section>
  <section class="kt-shell kt-popup" data-screen="popup" hidden>
    <header class="kt-header"><h2>KU-LMS</h2><small>当前设备</small></header>
    <div class="kt-popup-content"><div class="kt-nav"><button id="kt-todo-tab" aria-pressed="true">TODO <span data-total>3</span></button><button id="kt-settings-tab" aria-pressed="false">设置</button></div>
      <div id="kt-popup-todos"><label for="kt-course-select">课程</label><select class="kt-select" id="kt-course-select"><option value="all">全部课程</option><option value="sound">サウンド知覚情報処理</option><option value="python">プログラミング実習（Ｐｙｔｈｏｎ）</option></select><div id="kt-popup-list" class="kt-list"></div><form class="kt-add" id="kt-popup-form" hidden><input aria-label="新建 TODO" placeholder="添加待办…" maxlength="200" required><button type="submit">添加</button></form><small id="kt-choose-note">选择课程后可添加待办</small><div class="kt-footer"><small>本地保存 · 可导出备份</small><button id="kt-backup">备份与恢复</button></div></div>
      <div id="kt-settings" hidden><h3>扩展设置</h3><p>保留启用扩展、账号和自动登录设置。</p><small>本草案不读取或修改真实设置。</small></div>
    </div>
  </section>
  <p class="kt-status" role="status" aria-live="polite" id="kt-status">演示数据，可勾选、编辑或添加；不会写入扩展。</p>
</div>
<script>
(()=>{const root=document.getElementById('ku-todo-design');const names={sound:'サウンド知覚情報処理',python:'プログラミング実習（Ｐｙｔｈｏｎ）'};let rows=[{id:1,course:'sound',text:'第2回のスライドを復習',done:false},{id:2,course:'sound',text:'レポートの構成をまとめる',done:false},{id:3,course:'python',text:'演習コードを整理する',done:false}];let selected='sound';const q=s=>root.querySelector(s);const status=t=>q('#kt-status').textContent=t;
function list(el,course,group){el.replaceChildren();const items=rows.filter(r=>course==='all'||r.course===course);items.forEach(r=>{const line=document.createElement('div');line.className='kt-row';const box=document.createElement('input');box.type='checkbox';box.checked=r.done;box.setAttribute('aria-label',r.text);box.onchange=()=>{r.done=box.checked;render();status('演示：完成状态已更新，正式功能会在写入成功后显示“已保存”。')};const label=document.createElement('label');const title=document.createElement('span');title.textContent=r.text;if(r.done)title.className='kt-done';label.append(title);if(group){const c=document.createElement('button');c.textContent=names[r.course];c.onclick=()=>openCourse(r.course);const small=document.createElement('small');small.append(c);label.append(small)}const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{const field=document.createElement('input');field.value=r.text;field.maxLength=200;field.setAttribute('aria-label','编辑待办');label.replaceChildren(field);edit.textContent='保存';edit.onclick=()=>{if(!field.value.trim())return; r.text=field.value.trim();render();status('演示：内容已更新。')};field.focus()};line.append(box,label,edit);el.append(line)});if(!items.length)el.textContent='暂无 TODO，添加第一条待办。'}
function render(){root.querySelectorAll('[data-total]').forEach(e=>e.textContent=rows.filter(r=>!r.done).length);root.querySelectorAll('[data-count]').forEach(e=>e.textContent=rows.filter(r=>!r.done&&r.course===e.dataset.count).length);list(q('#kt-home-list'),'all',true);list(q('#kt-course-list'),selected,false);const pc=q('#kt-course-select').value;list(q('#kt-popup-list'),pc,pc==='all');q('#kt-popup-form').hidden=pc==='all';q('#kt-choose-note').hidden=pc!=='all'}
function openCourse(c){selected=c;q('#kt-editor-title').textContent=names[c]+' · TODO';q('#kt-course-editor').hidden=false;show('home');render()}
function show(v){root.querySelectorAll('[data-screen]').forEach(e=>e.hidden=e.dataset.screen!==v);root.querySelectorAll('[data-view]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.view===v)))}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));root.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course));root.querySelectorAll('[data-syllabus]').forEach(b=>b.onclick=()=>status('正式功能中「シ」仍打开课程大纲；预览不跳转。'));q('#kt-close').onclick=()=>q('#kt-course-editor').hidden=true;q('#kt-course-select').onchange=render;
['course','popup'].forEach(kind=>q('#kt-'+kind+'-form').onsubmit=e=>{e.preventDefault();const input=e.currentTarget.querySelector('input');const text=input.value.trim();if(!text)return;rows.push({id:Date.now(),course:kind==='course'?selected:q('#kt-course-select').value,text,done:false});input.value='';render();status('演示：已添加，三个入口的数量同步更新。')});
function settings(on){q('#kt-settings').hidden=!on;q('#kt-popup-todos').hidden=on;q('#kt-settings-tab').setAttribute('aria-pressed',String(on));q('#kt-todo-tab').setAttribute('aria-pressed',String(!on))}q('#kt-settings-tab').onclick=()=>settings(true);q('#kt-todo-tab').onclick=()=>settings(false);q('#kt-backup').onclick=()=>status('设计：导出 TODO 与课程目录；导入先校验并预览差异，不包含账号密码。');render();
if(globalThis.Tweak){const options={showReminder:true};const tweak=new Tweak({container:root,onChange:()=>{q('.kt-alert').hidden=!options.showReminder}});tweak.addToggle(options,'showReminder',{label:'同时显示截止提醒'});}
})();
</script>
