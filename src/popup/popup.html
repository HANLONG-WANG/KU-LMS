<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KU-LMS TODO</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="../shared/todo-ui.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img src="../../assets/icons/icon48.png" alt="" class="popup-icon">
        <div>
          <h1>KU-LMS</h1>
          <p>课程待办与扩展设置</p>
        </div>
      </header>

      <nav class="popup-tabs" role="tablist" aria-label="扩展功能"><button id="todo-tab" type="button" role="tab" aria-selected="true" aria-controls="todo-page">TODO</button><button id="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-form">设置</button></nav>
      <section id="google-sync-panel" aria-label="Google 同步"></section>
      <section id="todo-page" role="tabpanel" aria-labelledby="todo-tab"></section>
      <form id="settings-form" class="settings-form" role="tabpanel" aria-labelledby="settings-tab" hidden>
        <label class="switch-row">
          <span>
            <strong>启用扩展</strong>
            <small>关闭后当前页面会恢复原始 KU-LMS 页面。</small>
          </span>
          <input id="enabled" type="checkbox" role="switch">
        </label>

        <label class="field">
          <span>用户名</span>
          <input id="username" name="username" type="text" autocomplete="username" spellcheck="false">
        </label>

        <label class="field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password">
        </label>

        <label class="reveal-row">
          <input id="show-password" type="checkbox">
          <span>显示密码</span>
        </label>

        <label class="switch-row">
          <span>
            <strong>自动登录</strong>
            <small>使用已保存的账号和密码自动登录。关闭后仅填充，不自动提交。</small>
          </span>
          <input id="auto-login" type="checkbox" role="switch">
        </label>

        <button id="save" type="submit">保存</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </main>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
    <script src="../shared/todo-client.js"></script>
    <script src="../shared/todo-ui.js"></script>
    <script src="todo-popup.js"></script>
    <script src="google-sync.js"></script>
  </body>
</html>
